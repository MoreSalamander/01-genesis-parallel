name: genesis-signal
# Genesis OS — Signal Intelligence · owned infrastructure (production posture).
#   docker compose up -d
# PostgreSQL  : durable mission/decision state        localhost:5433
# NATS        : event fabric (genesis.signal.events)  localhost:4223
# (DataHub GMS is an external substrate at localhost:8080 — quickstart stack.)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: genesis
      POSTGRES_DB: genesis_signal
    ports: ["5433:5432"]
    volumes:
      - pgdata_signal:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js"]
    ports: ["4223:4222"]

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes:
      - qdrant_signal:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: genesis
      MINIO_ROOT_PASSWORD: genesis-secret
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_signal:/data

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9201:9200"]

  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/genesis-secret
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - neo4j_signal:/data

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: genesis
      POSTGRES_PWD: genesis
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    depends_on: [postgres]

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports: ["8233:8080"]
    depends_on: [temporal]

volumes:
  pgdata_signal:
  qdrant_signal:
  minio_signal:
  neo4j_signal:
