[project]
name = "genesis-parallel"
version = "0.1.0"
description = "Genesis OS — Signal Intelligence. Standalone external-intelligence system (Parallel track, Google Cloud Agentic Cinema Hackathon)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "parallel-web>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
datahub = ["acryl-datahub>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
